<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
/* Idea de layout: una columna de tarjetas pensada para el pulgar, números grandes tipo marcador,
   y los colores de los discos olímpicos (25 rojo, 20 azul, 15 amarillo, 10 verde) como código visual. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface2:#F3F5F8; --line:#D6DBE2;
  --ink:#12161C; --muted:#5A6471;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E2E9FB;
  --good:#1A8554; --good-soft:#DDF2E7; --warn:#A9690B; --warn-soft:#FBEFD6; --bad:#C2352B; --bad-soft:#FBE3E0;
  --p25:#C8372D; --p20:#1F4FD8; --p15:#D9A900; --p10:#1E8E5A; --p5:#E9ECEF; --p2:#2A2F36; --p1:#9AA3AE;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#161A21; --surface2:#1E232C; --line:#2A313C;
    --ink:#EEF2F6; --muted:#96A0AD;
    --accent:#7098FF; --accent-ink:#0A1024; --accent-soft:#1A2648;
    --good:#4CC38A; --good-soft:#143326; --warn:#E5B454; --warn-soft:#3A2D10; --bad:#F0736A; --bad-soft:#3D1A17;
    --p5:#DADFE5; --p2:#4A525E; --p1:#7C8693;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161A21; --surface2:#1E232C; --line:#2A313C;
  --ink:#EEF2F6; --muted:#96A0AD;
  --accent:#7098FF; --accent-ink:#0A1024; --accent-soft:#1A2648;
  --good:#4CC38A; --good-soft:#143326; --warn:#E5B454; --warn-soft:#3A2D10; --bad:#F0736A; --bad-soft:#3D1A17;
  --p5:#DADFE5; --p2:#4A525E; --p1:#7C8693;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden;padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:19px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13.5px}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--good)} .sync.busy i{background:var(--warn)} .sync.off i{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.hero{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card.hero .muted,.card.hero .eyebrow{color:inherit;opacity:.8}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.row.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;
  font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.inv{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;width:100%;min-width:0}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.inp{height:auto;padding:10px 12px;min-height:70px;resize:vertical}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0;text-align:left;width:100%}
.li:first-child{border-top:0;padding-top:0}.li:last-child{padding-bottom:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted)}
.wd b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--display);font-size:16px;color:var(--ink)}
.wd.done b{background:var(--good);border-color:var(--good);color:#fff}
.wd.today{background:var(--surface2)}
.wd.today b{border-color:var(--accent)}
.wd.done.today b{border-color:var(--good)}
/* suplementos */
.sup{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);width:100%;text-align:left}
.sup .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.sup.on{background:var(--good-soft);border-color:transparent}
.sup.on .box{background:var(--good);border-color:var(--good);color:#fff}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;min-width:0}
.tile .num{font-size:32px;line-height:1}
.tile .lbl{font-size:12.5px;color:var(--muted);margin-top:4px}
/* sesión */
.sbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sbar .num{font-size:24px}
.exh{display:flex;align-items:flex-start;gap:10px}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.sets .hd{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.sets .n{font-family:var(--display);font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.sets .prev{font-size:13.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);text-align:center;font-family:var(--display);font-weight:600;font-size:20px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.sets input::placeholder{color:var(--muted);opacity:.55}
.chk{height:44px;width:46px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.sets .rowdone input{background:var(--good-soft);border-color:transparent}
.hint{font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.hint.up{background:var(--good-soft)}
.plates{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.plate{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:5px;font-family:var(--display);font-weight:700;font-size:14px;color:#fff}
.plate.k25{background:var(--p25)}.plate.k20{background:var(--p20)}.plate.k15{background:var(--p15);color:#1b1b1b}.plate.k10{background:var(--p10)}
.plate.k5{background:var(--p5);color:#1b1b1b;border:1px solid var(--line)}.plate.k2{background:var(--p2)}.plate.k1{background:var(--p1)}
.rest{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:var(--bg)}
.rest .num{font-size:30px;min-width:74px}
.rest .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 35%,transparent);color:inherit}
.rest.end{background:var(--good);color:#fff}
@media (prefers-reduced-motion:no-preference){
  .wrap.enter{animation:enter .22s ease-out}
  @keyframes enter{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
  .chk.pop{animation:pop .28s ease-out}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  .btn,.chip,.sup,.chk,nav button{transition:transform .08s,background-color .15s,border-color .15s}
  .sup:active,.chip:active,nav button:active{transform:scale(.97)}
  .pbar i,.vol .fill{transition:width .3s ease-out}
  .toast{animation:enter .18s ease-out}
}
.pbar{height:3px;background:var(--line)}.pbar i{display:block;height:100%;background:var(--good)}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.fold{flex-direction:row;align-items:center;padding:12px 16px;text-align:left;width:100%;background:var(--surface2)}
.card.fold .ok{width:28px;height:28px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;flex:none}
.restline{height:3px;background:color-mix(in srgb,var(--bg) 25%,transparent)}.restline i{display:block;height:100%;background:var(--accent)}
.warm{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface2)}
.fig{background:var(--surface2);border-radius:16px;padding:8px}
.fig svg{width:100%;max-height:300px;display:block}
.rirq{display:flex;flex-direction:column;gap:8px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line)}
.rirq .btn{padding:0 4px}
.rirq .btn.sel{background:var(--accent);color:var(--accent-ink)}
/* nav */
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px}
/* hoja */
.ov{position:fixed;inset:0;background:rgba(8,10,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px}
.sheet .sb{padding:4px 16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.x{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:30;max-width:90%;text-align:center}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dh{font-size:11.5px;text-align:center;color:var(--muted);font-weight:600}
.cal .c{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:13.5px;font-variant-numeric:tabular-nums;background:var(--surface2);color:var(--muted)}
.cal .c.on{background:var(--good);color:#fff;font-weight:700}
.cal .c.td{outline:2px solid var(--accent);outline-offset:-2px}
.cal .c.e{background:transparent}
/* barras volumen */
.vol{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:13.5px}
.vol .bar{height:14px;border-radius:7px;background:var(--surface2);position:relative;overflow:hidden}
.vol .bar .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 22%,transparent)}
.vol .bar .fill{position:absolute;top:3px;bottom:3px;left:0;border-radius:4px;background:var(--accent)}
.vol .v{text-align:right;font-family:var(--display);font-weight:700;font-size:17px}
svg.chart{width:100%;height:auto;display:block}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.step button{width:36px;height:36px;font-size:20px;font-weight:600}
.step span{min-width:26px;text-align:center;font-family:var(--display);font-weight:700;font-size:18px}
.mini{width:52px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);text-align:center;font-family:var(--display);font-weight:600;font-size:17px}
ol.cues,ul.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--ink);font-size:14.5px;display:flex;flex-direction:column;gap:10px}
a{color:var(--accent)}
@media (min-width:880px){
  body{flex-direction:row-reverse}
  nav{flex-direction:column;justify-content:flex-start;gap:4px;width:190px;border-top:0;border-right:1px solid var(--line);padding:18px 10px}
  nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;justify-content:flex-start}
  .grid2{grid-template-columns:1fr 1fr;align-items:start}
  .ov{align-items:center}.sheet{border-radius:20px;max-height:86%}
  #session{flex:1}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}

/* ===== piel estilo iOS: tipografía del sistema, negro puro, acento naranja ===== */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface2:#EFEFF4; --line:#E0E0E6;
  --ink:#000000; --muted:#6C6C70;
  --accent:#D9480F; --accent-ink:#FFFFFF; --accent-soft:#FFE8D6;
  --good:#1F8A3B; --good-soft:#DDF5E3; --warn:#8A6A00; --warn-soft:#FFF4C2; --bad:#D70015; --bad-soft:#FDE2E4;
  --p5:#E5E5EA; --p2:#2C2C2E; --p1:#8E8E93;
  --hero-a:#FFB340; --hero-b:#FF6B1A;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --line:#38383A;
    --ink:#FFFFFF; --muted:#98989F;
    --accent:#FF9F0A; --accent-ink:#1A0D00; --accent-soft:#3A2405;
    --good:#30D158; --good-soft:#0F3A1C; --warn:#FFD60A; --warn-soft:#3A3200; --bad:#FF453A; --bad-soft:#3D1513;
    --p5:#E5E5EA; --p2:#48484A; --p1:#8E8E93;
    --hero-a:#FFB340; --hero-b:#FF6B1A;
    color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --line:#38383A;
    --ink:#FFFFFF; --muted:#98989F;
    --accent:#FF9F0A; --accent-ink:#1A0D00; --accent-soft:#3A2405;
    --good:#30D158; --good-soft:#0F3A1C; --warn:#FFD60A; --warn-soft:#3A3200; --bad:#FF453A; --bad-soft:#3D1513;
    --p5:#E5E5EA; --p2:#48484A; --p1:#8E8E93;
    --hero-a:#FFB340; --hero-b:#FF6B1A;
    color-scheme:dark;}
html,body{height:100%}
@supports (height:100dvh){html,body{height:100dvh}}
@media (display-mode:standalone){html,body{height:100vh}}
body{font-size:16px;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--body);text-transform:none;letter-spacing:-.022em}
h1{font-size:32px;font-weight:800;line-height:1.1}
h2{font-size:22px;font-weight:700;line-height:1.2}
h3{font-size:18px;font-weight:650}
.eyebrow{font-size:14px;font-weight:600;text-transform:none;letter-spacing:0}
.eyebrow::first-letter{text-transform:uppercase}
.tag{font-size:13px;font-weight:600;text-transform:none;letter-spacing:0}
.wrap{padding:14px 16px 28px;gap:12px}
.top{align-items:flex-end;padding:6px 4px 2px}
.sync{padding-bottom:9px}
.card{border:0;padding:18px;gap:14px}
.card.fold{padding:14px 18px}
.card.cur{box-shadow:0 0 0 2px var(--accent)}
.card.hero{background:linear-gradient(140deg,var(--hero-a),var(--hero-b));color:#1A0D00;padding:20px;gap:10px}
.card.hero h2{font-size:26px;font-weight:800;line-height:1.12}
.card.hero .muted,.card.hero .eyebrow{color:#1A0D00;opacity:.72}
.card.hero .row{margin-top:6px}
.btn{min-height:50px;border-radius:14px;border-color:transparent;background:var(--surface2);font-weight:600;letter-spacing:-.01em}
.btn.sm{min-height:36px;border-radius:11px}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.inv{background:#0B0B0C;color:#FFFFFF}
.btn.hero2{background:rgba(26,13,0,.12);color:#1A0D00;border-color:transparent}
.chip{border-color:transparent;font-weight:600;font-size:13px;padding:6px 12px}
.inp{border-color:transparent;border-radius:12px;height:48px}
.sets input,.mini,.step{border-color:transparent}
.sets input{height:46px;border-radius:12px;font-size:21px}
.chk{height:46px;border-radius:12px;border-color:transparent;background:var(--surface2)}
.chk.on{background:var(--good);color:#04210C}
.sets .hd{font-size:11px}
.hint{border-radius:12px;padding:10px 12px;font-size:14px}
.sup{border-color:transparent;border-radius:14px;padding:14px}
.sup .box{border-radius:50%;width:30px;height:30px}
.sup.on .box{color:#04210C}
.wd{font-size:12px;border-radius:12px}
.wd b{width:34px;height:34px;border:0;background:var(--surface2);font-size:16px}
.wd.done b{background:var(--good);color:#04210C}
.wd.today{background:transparent}

const pad=n=>String(n).padStart(2,'0');

const addDays=(s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return ymd(d)};

const fmtD=(s,o)=>pdate(s).toLocaleDateString('es-AR',o||{day:'numeric',month:'short'});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmtN=n=>n==null?'':String(Math.round(n*100)/100).replace('.',',');
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)};

function limb(Ra,Ma,Ta,Rb,Mb,Tb,R,T,t,rot){

  if(rot){const a1=mixA(ang(sub(Ma,Ra)),ang(sub(Mb,Rb))),M=[R[0]+Math.cos(a1)*l1,R[1]+Math.sin(a1)*l1],a2=mixA(ang(sub(Ta,Ma)),ang(sub(Tb,Mb)));return [M,[M[0]+Math.cos(a2)*l2,M[1]+Math.sin(a2)*l2]]}

function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j){S.docs=j.docs||{};S.dirty=j.dirty||{};S.synced=!!j.synced;S.since=j.since||0}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({docs:S.docs,dirty:S.dirty,synced:S.synced,since:S.since}))}catch(e){}}
function put(id,data,delay){
  if(data===undefined)delete S.docs[id];else S.docs[id]=data;
  S.dirty[id]=1;saveLocal();
  if(!S.col){setSync();return}
  clearTimeout(S.timers[id]);S.timers[id]=setTimeout(()=>flush(id),delay==null?500:delay);setSync();
}
const CFG='gym.cfg';
function cfg(){try{return JSON.parse(localStorage.getItem(CFG)||'null')}catch(e){return null}}
async function api(body){
  const c=cfg();
  const r=await fetch('https://script.google.com/macros/s/'+c.u+'/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:c.k},body))});
  const j=await r.json();if(!j.ok)throw Object.assign(new Error(j.error||'error'),{code:j.error});return j;
}
async function flush(id){
  if(!S.col)return;
  if(S.writing[id]){S.again[id]=1;return}
  S.writing[id]=1;let ok=true;
  try{const d=S.docs[id];await api({op:'push',items:[{id,data:d===undefined?null:clone(d)}]});S.err=null;S.pushed[id]=Date.now()}
  catch(e){ok=false;S.err=e}
  S.writing[id]=0;
  if(S.again[id]){S.again[id]=0;flush(id);return}
  if(ok){delete S.dirty[id];saveLocal()}
  setSync();
}
function setSync(){
  const el=$('#sync');if(!el)return;
  let c='off',t='Sin sincronizar';
  if(S.mode==='cargando'){c='busy';t='Conectando…'}
  else if(S.mode==='sync'){
    if(S.err){c='off';t='Sin conexión; guardado acá'}
    else if(Object.keys(S.dirty).length){c='busy';t='Guardando…'}
    else{c='ok';t=''}
  }else if(S.mode==='lento'){c='busy';t='Sin conexión; guardado acá'}
  el.className='sync '+c;el.lastChild.textContent=t;
}
async function pull(){
  if(!S.col||S.pulling)return;
  S.pulling=1;const started=Date.now(),full=!S.since;let changed=false;
  try{
    const j=await api({op:'pull',since:S.since||0});
    const seen={};
    j.items.forEach(it=>{
      seen[it.id]=1;
      if(S.dirty[it.id]||S.writing[it.id]||(S.pushed[it.id]||0)>started)return;
      if(it.d==null){if(it.id in S.docs){delete S.docs[it.id];changed=true}}
      else if(JSON.stringify(S.docs[it.id])!==JSON.stringify(it.d)){S.docs[it.id]=it.d;changed=true}
    });
    if(full)for(const id of Object.keys(S.docs)){if(!seen[id]&&!S.dirty[id]&&!S.writing[id]){if(S.synced){delete S.docs[id];changed=true}else S.dirty[id]=1}}
    S.since=Math.max(1,j.now-5000);S.synced=true;S.err=null;
    if(S.mode!=='sync'){S.mode='sync';changed=true}
    for(const id of Object.keys(S.dirty))flush(id);
    saveLocal();
  }catch(e){
    S.err=e;
    if(e.code==='key'){localStorage.removeItem(CFG);S.col=null;S.mode='local';changed=true;toast('El código de sincronización no es válido')}
    else if(S.mode==='cargando'){S.mode='lento';changed=true}
  }
  S.pulling=0;setSync();
  if(changed)softRender();
}
function initSync(){
  if(!cfg()){S.col=null;S.mode='local';render();return}
  S.col=true;if(S.mode!=='sync')S.mode='cargando';
  pull();
}

const profile=()=>S.docs.profile||null;
const program=()=>S.docs.program||null;
const active=()=>S.docs.active||null;
function workouts(){return Object.keys(S.docs).filter(k=>k.startsWith('w_')).map(k=>Object.assign({id:k},S.docs[k])).sort((a,b)=>a.start-b.start)}
function logDay(d){const m=S.docs['log_'+d.slice(0,7)];return (m&&m.d&&m.d[d.slice(8)])||{}}
function setLogDay(d,fn){const id='log_'+d.slice(0,7);const m=clone(S.docs[id]||{d:{}});const k=d.slice(8);m.d[k]=m.d[k]||{};fn(m.d[k]);put(id,m)}
function supps(){const p=profile();return (p&&p.supps)||[]}
function bwSeries(){const out=[];Object.keys(S.docs).filter(k=>k.startsWith('log_')).sort().forEach(k=>{const m=S.docs[k];Object.keys(m.d||{}).sort().forEach(dd=>{if(m.d[dd].bw!=null)out.push({d:k.slice(4)+'-'+dd,v:m.d[dd].bw})})});return out}
const lastBw=()=>{const s=bwSeries();return s.length?s[s.length-1].v:null};
function attended(){const set={};workouts().forEach(w=>set[w.date]=1);return set}
function lastPain(exId){const ws=workouts();for(let i=ws.length-1;i>=0;i--){const e=(ws[i].ex||[]).find(x=>x.exId===exId);if(e)return e.pain||0}return 0}
function histOf(exId){const out=[];workouts().forEach(w=>(w.ex||[]).forEach(e=>{if(e.exId===exId&&e.sets&&e.sets.length)out.push({date:w.date,sets:e.sets})}));return out}
const e1rm=(w,r)=>r<=0?0:r<=1?w:w*(1+r/30);
const fmtSet=x=>fmtN(x[0])+'×'+x[1]+(x[3]?'+'+x[3]+'a':'');
const ASL=['','poca','media','mucha'];
function bestOf(exId,sets){const bw=ex(exId).bw&&sets.every(s=>!s[0]);let b=0,bs=null;sets.forEach(s=>{const v=bw?s[1]:e1rm(s[0],s[1]);if(v>b){b=v;bs=s}});return {v:b,set:bs,reps:bw}}
function suggest(exId,lo,hi,si,deload){
  const h=histOf(exId);if(!h.length)return null;
  const last=h[h.length-1].sets,prev=last[Math.min(si,last.length-1)],inc=ex(exId).inc;
  if(deload)return {w:prev[0],r:Math.max(lo,prev[1]-2),top:false};
  const top=last.every(s=>s[1]>=hi),easy=!top&&last.every(s=>s[2]!=null&&s[2]>=3),hard=last.every(s=>s[1]<lo)&&prev[0]-inc>0;
  if(top||easy)return {w:Math.round((prev[0]+inc)*100)/100,r:top?lo:Math.max(lo,prev[1]-1),top:true,easy};
  if(hard)return {w:Math.round((prev[0]-inc)*100)/100,r:lo,top:false,hard:true};
  return {w:prev[0],r:Math.min(hi,prev[1]+(prev[2]!=null&&prev[2]>=3?2:1)),top:false};
}
function blockWeek(){const p=program();if(!p)return 1;return Math.floor((pdate(monday(today()))-pdate(monday(p.created)))/6048e5)+1}
const isDeload=()=>{const p=program();return !!(p&&p.deload&&p.deload===monday(today()))};
function weekCount(mon){const a=attended();let n=0;for(let i=0;i<7;i++)if(a[addDays(mon,i)])n++;return n}
function weekStreak(){const goal=(profile()||{}).days||5;let mon=monday(today()),n=0;if(weekCount(mon)>=goal)n++;for(;;){mon=addDays(mon,-7);if(weekCount(mon)>=goal)n++;else break}return n}
function habStreak(fn){let d=today(),n=0;if(!fn(logDay(d)))d=addDays(d,-1);while(fn(logDay(d))){n++;d=addDays(d,-1);if(n>999)break}return n}
function suppStreak(id){let d=today(),n=0;if(!(logDay(d).s||{})[id])d=addDays(d,-1);while((logDay(d).s||{})[id]){n++;d=addDays(d,-1)}return n}
function volume(setsByEx){const v={};Object.keys(MUSC).forEach(m=>v[m]=0);setsByEx.forEach(([id,n])=>{const e=ex(id);v[e.m]=(v[e.m]||0)+n;(e.s||[]).forEach(m=>v[m]=(v[m]||0)+n*.5)});return v}
const plannedVol=()=>{const p=program();if(!p)return null;const a=[];p.days.forEach(d=>d.ex.forEach(e=>a.push([e.exId,e.sets])));return volume(a)};
function weekVol(){const mon=monday(today()),a=[];workouts().forEach(w=>{if(w.date>=mon&&w.date<=addDays(mon,6))(w.ex||[]).forEach(e=>a.push([e.exId,e.sets.length]))});return volume(a)}
function platesFor(total){const bar=(profile()||{}).bar||20;let side=(total-bar)/2;if(!(side>0))return null;const out=[];[25,20,15,10,5,2.5,1.25].forEach(p=>{while(side>=p-1e-9){out.push(p);side-=p}});return side>0.01?null:out}

const MEAS=[['brazo','Brazo'],['pecho','Pecho'],['cintura','Cintura'],['muslo','Muslo']];
let phDb=null;
function phOpen(){return new Promise(res=>{if(phDb)return res(phDb);try{const r=indexedDB.open('gym-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'id'});r.onsuccess=()=>{phDb=r.result;res(phDb)};r.onerror=()=>res(null)}catch(e){res(null)}})}
async function phLoad(){const db=await phOpen();if(!db){UI.photos=[];return}
  await new Promise(res=>{const rq=db.transaction('f').objectStore('f').getAll();rq.onsuccess=()=>{(UI.photos||[]).forEach(x=>{try{URL.revokeObjectURL(x.url)}catch(e){}});UI.photos=rq.result.sort((a,b)=>a.id-b.id).map(x=>({id:x.id,d:x.d,url:URL.createObjectURL(x.blob)}));res()};rq.onerror=()=>{UI.photos=[];res()}})}
async function phAdd(file){
  const db=await phOpen();if(!db){toast('Este navegador no deja guardar fotos');return}
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});
    const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.82));
    await new Promise((res,rej)=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').put({id:Date.now(),d:today(),blob});tx.oncomplete=res;tx.onerror=rej});
    await phLoad();toast('Foto guardada');render();
  }catch(e){toast('No se pudo guardar la foto')}
}
async function phDelete(id){const db=await phOpen();if(!db)return;await new Promise(res=>{const tx=db.transaction('f','readwrite');tx.objectStore('f').delete(id);tx.oncomplete=res;tx.onerror=res});await phLoad()}

function render(){
  const p=profile(),main=$('#main'),nav=$('#nav');
  if(!p){nav.style.display='none';main.innerHTML=S.mode==='cargando'?'<div class="wrap">'+head('Un momento','Cargando tus datos')+'</div>':(!cfg()&&!UI.skipSetup?vSetup():vOnboard());renderSheet();setSync();return}
  if(S.mode!=='cargando'&&!program())put('program',presetProgram('franopt',0),0);
  if(S.mode!=='cargando'&&program()&&PRESET[program().preset]&&(program().rev||0)<3&&program().preset!=='fran')saveProgram(p=>{const src=PRESET[p.preset].days;p.days.forEach((d,i)=>{if(src[i])d.ex=clone(src[i][1])});p.rev=3});
  if(S.mode!=='cargando'&&program()&&program().days.some(d=>WD.test(d.name)))saveProgram(p=>p.days.forEach(d=>d.name=d.name.replace(WD,'')));
  keepAwake(UI.tab==='session'&&!!active());
  if(UI.tab==='session'&&active()){nav.style.display='none';main.innerHTML=vSession();tickTimer();renderSheet();return}
  if(UI.tab==='session')UI.tab='hoy';
  nav.style.display='';
  nav.innerHTML=[['hoy','Hoy'],['rutina','Rutina'],['progreso','Progreso'],['tecnica','Técnica'],['perfil','Perfil']].map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${UI.tab===k?'on':''}" aria-current="${UI.tab===k?'page':'false'}">${ICON[k]}<span>${l}</span></button>`).join('');
  const st=main.scrollTop,same=main.dataset.tab===UI.tab;

  main.dataset.tab=UI.tab;main.scrollTop=same?st:0;
  renderSheet();setSync();
}

function ring(n,goal){const r=17,c=2*Math.PI*r,f=Math.min(1,goal?n/goal:0);return `<svg class="ring" width="46" height="46" viewBox="0 0 46 46" role="img" aria-label="${n} de ${goal} días"><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="5"/>${f>0?'':'<!--'}<circle cx="23" cy="23" r="${r}" fill="none" stroke="${f>=1?'var(--good)':'var(--accent)'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 23 23)"/>${f>0?'':'-->'}<text x="23" y="28" text-anchor="middle">${n}</text></svg>`}
function weekStrip(){
  const mon=monday(today()),a=attended(),t=today();
  return '<div class="week">'+['L','M','M','J','V','S','D'].map((l,i)=>{const d=addDays(mon,i);return `<div class="wd ${a[d]?'done':''} ${d===t?'today':''}"><span>${l}</span><b>${a[d]?ICON.check.replace('width="20" height="20"','width="16" height="16"'):pdate(d).getDate()}</b></div>`}).join('')+'</div>';
}

/* ---------- sesión ---------- */
function vSession(){
  const a=active(),tot=a.ex.reduce((n,e)=>n+e.sets.length,0),dn=a.ex.reduce((n,e)=>n+e.sets.filter(x=>x.done).length,0);
  let h=`<div id="session" style="display:flex;flex-direction:column;height:100%"><div class="sbar"><button class="x" data-a="minimize" aria-label="Volver sin terminar">${ICON.x}</button><div class="grow"><div class="t" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.dayName)}</div><div class="small muted">${a.deload?'Semana de descarga · ':''}<span id="elapsed"></span></div></div><button class="btn primary sm" data-a="finish">Terminar</button></div>
  <div class="pbar" role="progressbar" aria-label="Series hechas" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${dn}"><i style="width:${tot?dn/tot*100:0}%"></i></div>
  <div style="flex:1;overflow-y:auto" id="sscroll"><div class="wrap">`;
  const curEx=a.ex.findIndex(e=>e.sets.some(x=>!x.done));

    const ssPrev=ei>0&&a.ex[ei-1].ss;
    if(e.sets.every(x=>x.done)&&UI.openEx!==ei){h+=`<button class="card fold" id="ex-${ei}" data-a="exopen" data-e="${ei}" aria-label="Ver ${esc(d.n)}"><span class="ok">${ICON.check.replace('width="20" height="20"','width="16" height="16"')}</span><span class="grow"><span class="t" style="font-weight:600">${esc(d.n)}</span><br><span class="small muted">${e.sets.map(x=>esc(x.w)+'×'+esc(x.r)).join(' · ')}</span></span><span class="muted">›</span></button>`;return}
    h+=`<div class="card ${ei===curEx?'cur':''}" id="ex-${ei}">${e.ss||ssPrev||e.tec?`<div class="chips">${e.ss?`<span class="chip on">Superserie con ${esc(ex(a.ex[ei+1]?a.ex[ei+1].exId:'').n)}</span>`:''}${ssPrev?`<span class="chip on">Superserie · segunda parte</span>`:''}${e.tec?`<span class="chip warn">${esc(e.tec)}</span>`:''}</div>`:''}<div class="exh"><div class="grow"><h3>${esc(d.n)}</h3><div class="small muted">${e.sets.length} × ${e.lo}–${e.hi} reps · descanso ${mmss(restTier(e)[3])} a ${mmss(restTier(e)[0])}</div></div><button class="btn sm" data-a="tech" data-v="${esc(e.exId)}">Técnica</button></div>`;
    {const fs=e.sets[0];if(!e.sets.some(x=>x.done))h+=warmBlock(a,e,ei,num(fs.w)??(sg0?sg0.w:(last?last.sets[0][0]:null)))}
    {const lp=lastPain(e.exId);if(lp&&!e.pain)h+=`<div class="hint" style="background:var(--warn-soft)"><b>La última vez marcaste una molestia ${['','leve','media','fuerte'][lp]} acá.</b> Arrancá con menos peso y, si vuelve, cambiá el ejercicio.</div>`}
    if(a.deload)h+='<div class="hint">Descarga: mismo peso de siempre, menos series y dejá 3–4 reps en reserva.</div>';
    else if(sg0&&sg0.top)h+=`<div class="hint up"><b>Objetivo: subí a ${fmtN(sg0.w)} kg × ${sg0.r}</b><br><span class="small muted">${sg0.easy?'La última vez te sobraron 3 o más reps':'La última vez llegaste a '+e.hi+' en todas'}</span></div>`;
    else if(sg0&&sg0.hard)h+=`<div class="hint"><b>Bajá a ${fmtN(sg0.w)} kg.</b> La última vez no llegaste a ${e.lo} reps en ninguna serie.</div>`;
    else if(sg0){const tg=e.sets.map((_,k)=>suggest(e.exId,e.lo,e.hi,k,false)),same=tg.every(t=>t.w===tg[0].w);
      h+=`<div class="hint"><b>Objetivo: ${same?fmtN(tg[0].w)+' kg × '+tg.map(t=>t.r).join(', '):tg.map(t=>fmtN(t.w)+'×'+t.r).join(' · ')}</b><br><span class="small muted">Última vez: ${last.sets.map(x=>x[1]+(x[3]?' (+'+x[3]+' con ayuda)':'')).join(', ')} reps</span></div>`}

    e.sets.forEach((s,si)=>{
      const sg=suggest(e.exId,e.lo,e.hi,si,a.deload),pv=last?last.sets[Math.min(si,last.sets.length-1)]:null;
      h+=`<div class="n">${si+1}</div><div class="prev" style="white-space:normal;line-height:1.15">${s.done&&(s.g!=null||s.as)?(s.g==null?'':s.g?'<b style="color:var(--good)">Logrado</b>':'<b style="color:var(--warn)">No llegó</b>')+(s.as?`<br><span style="font-size:11.5px">${s.as.n} con ayuda</span>`:''):pv?fmtSet(pv).replace('×',' × '):'—'}</div>
      <div class="${s.done?'rowdone':''}"><input id="w-${ei}-${si}" inputmode="decimal" data-in="set" data-e="${ei}" data-s="${si}" data-k="w" value="${esc(s.w)}" placeholder="${sg?fmtN(sg.w):''}" aria-label="Peso serie ${si+1}"></div>
      <div class="${s.done?'rowdone':''}"><input id="r-${ei}-${si}" inputmode="numeric" data-in="set" data-e="${ei}" data-s="${si}" data-k="r" value="${esc(s.r)}" placeholder="${sg?sg.r:e.lo}" aria-label="Repeticiones serie ${si+1}"></div>
      <button class="chk ${s.done?'on':''} ${UI.justChk===ei+'-'+si?'pop':''}" data-a="chk" data-e="${ei}" data-s="${si}" aria-label="Marcar serie ${si+1} hecha" aria-pressed="${s.done?'true':'false'}">${s.done&&s.rir!=null?`<span class="num" style="font-size:15px;line-height:1">R${s.rir>=4?'4+':s.rir}</span>`:ICON.check}</button>`;
    });
    h+='</div>';
    const wRef=num(e.sets[0].w)??(sg0?sg0.w:null);
    if(d.eq==='Barra'&&wRef){const pl=platesFor(wRef);if(pl)h+=`<div class="plates">${fmtN(wRef)} kg · por lado: ${pl.map(p=>`<span class="plate k${String(p).split('.')[0]}">${fmtN(p)}</span>`).join('')}</div>`}
    h+=`<div class="row wrapx"><button class="btn sm ghost" data-a="addset" data-e="${ei}">+ Serie</button>${e.sets.length>1?`<button class="btn sm ghost" data-a="delset" data-e="${ei}">− Serie</button>`:''}<button class="btn sm ghost" data-a="swap" data-e="${ei}">Cambiar ejercicio</button><button class="btn sm ghost ${e.pain?'danger':''}" data-a="pain" data-e="${ei}">${e.pain?'Molestia '+['','leve','media','fuerte'][e.pain]:'Me molesta'}</button></div></div>`;
  });
  h+=`<button class="btn block" data-a="addex">+ Agregar ejercicio</button>
    <div class="field"><label for="snote">Notas de la sesión</label><textarea class="inp" id="snote" data-in="note" placeholder="Cómo te sentiste, molestias, sueño…">${esc(a.note||'')}</textarea></div>
    <button class="btn primary block" data-a="finish">Terminar entrenamiento</button><button class="btn ghost danger block" data-a="discard">Descartar sin guardar</button>
  </div></div><div id="rest"></div></div>`;
  return h;
}
function tickTimer(){
  const a=active(),el=$('#elapsed');if(a&&el)el.textContent=mmss((Date.now()-a.start)/1000)+' de entrenamiento';
  const r=$('#rest');if(!r)return;
  let left=UI.timer?(UI.timer.end-Date.now())/1000:null;
  if(UI.timer&&left<=-900){const c=clone(active());closeRest(c);saveActive(c);left=null}
  const q=UI.rirAsk;
  if(!UI.timer&&!q){if(r.innerHTML){r.innerHTML='';r.dataset.k=''}return}
  const qs=q&&active()&&active().ex[q.ei]?active().ex[q.ei].sets[q.si]:null;
  const end=!!UI.timer&&left<=0,over=!!UI.timer&&left<=-15,key=[!!UI.timer,end,over,UI.timer?UI.timer.total+'/'+(UI.timer.why||''):'',q?q.ei+'-'+q.si:'',qs?qs.rir:'',qs&&qs.as?qs.as.l+'x'+qs.as.n:''].join('|');
  if(r.dataset.k!==key||!r.firstChild){
    r.dataset.k=key;
    const al=qs&&qs.as?qs.as.l:0;
    r.innerHTML=(q&&qs?`<div class="rirq"><div class="row between"><span class="small"><b>¿Cuántas reps más podías hacer solo?</b></span><button class="btn sm" data-a="askdone">Listo</button></div>
      <div class="row">${[0,1,2,3,4].map(v=>`<button class="btn sm grow ${qs.rir===v?'sel':''}" data-a="rir" data-v="${v}">${v===0?'0 · fallo':v===4?'4+':v}</button>`).join('')}</div>
      <div class="row"><span class="small" style="width:64px"><b>¿Ayuda?</b></span>${['No','Poca','Media','Mucha'].map((t,v)=>`<button class="btn sm grow ${al===v?'sel':''}" data-a="asl" data-v="${v}">${t}</button>`).join('')}</div>
      ${al?`<div class="row between"><span class="small">Reps en las que te ayudaron</span><span class="step"><button data-a="asn" data-v="-1" aria-label="Menos">−</button><span>${qs.as.n}</span><button data-a="asn" data-v="1" aria-label="Más">+</button></span></div>`:''}</div>`:'')+
      (UI.timer?`<div class="restline"><i id="rest-l"></i></div><div class="rest ${over?'over':end?'end':''}" role="timer"><span class="num" id="rest-n"></span><span class="grow small" style="line-height:1.25"><b>${over?'Te estás pasando':end?'¡A la siguiente serie!':'Descanso '+mmss(UI.timer.total)}</b>${over||end?'':`<br><span style="opacity:.75">${esc(UI.timer.why||'según el ejercicio')}</span>`}</span>${end?'':'<button class="btn sm" data-a="tadj" data-v="-15" aria-label="15 segundos menos">−15</button><button class="btn sm" data-a="tadj" data-v="15" aria-label="15 segundos más">+15</button>'}<button class="btn sm" data-a="tskip">${end?'Listo':'Saltar'}</button></div>`:'');
    if(end&&!over){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  }
  const n=$('#rest-n');if(n)n.textContent=left>0?mmss(left):'+'+mmss(-left);
  const l=$('#rest-l');if(l&&UI.timer)l.style.width=Math.max(0,Math.min(100,(1-left/(UI.timer.total||90))*100))+'%';
}
setInterval(tickTimer,500);
function cancelBeep(){beepNodes.forEach(o=>{try{o.stop()}catch(e){}});beepNodes=[]}
function scheduleBeep(sec){
  cancelBeep();
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended')audio.resume();
    [[0,880],[.25,880],[.5,880],[30,660],[30.25,660],[60,660],[60.25,660],[60.5,660]].forEach(([off,fq])=>{if(sec+off<0)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=fq;g.gain.value=.15;o.connect(g);g.connect(audio.destination);const t0=audio.currentTime+Math.max(0,sec+off);o.start(t0);o.stop(t0+.15);beepNodes.push(o)});
  }catch(e){}
}
/* Descanso según el esfuerzo: más corto si sobraron reps, más largo si llegaste al fallo.
   Piso de 60–90 s (por debajo se pierde rendimiento); techo de 3 min en los ejercicios pesados. */
function restTier(e){const b=e.rest||90;return b>=120?[180,150,120,90]:b>=75?[120,105,90,75]:[90,75,60,60]}
function restFor(e,st){const t=restTier(e);if(st&&st.as)return [t[0],'por la ayuda'];if(!st||st.rir==null)return [t[1],'se ajusta al marcar'];const r=Math.min(3,st.rir);return [t[r],['por llegar al fallo','te quedaba 1 rep','te quedaban 2','te sobraban 3 o más'][r]]}
function saveTimer(){try{if(UI.timer)localStorage.setItem('gym.timer',JSON.stringify(UI.timer));else localStorage.removeItem('gym.timer')}catch(e){}}
function closeRest(a){
  if(UI.timer&&a){const ov=(Date.now()-UI.timer.end)/1000;if(ov>0){a.over=Math.round((a.over||0)+Math.min(ov,900))}a.rests=(a.rests||0)+1}
  UI.timer=null;cancelBeep();saveTimer();
}
function startRest(e,st,ei,si){const [d,why]=restFor(e,st);UI.timer={start:Date.now(),end:Date.now()+d*1000,total:d,extra:0,why,ei,si};scheduleBeep(d);saveTimer();tickTimer()}
function retime(a){
  const t=UI.timer,q=UI.rirAsk;if(!t||!q||t.ei!==q.ei||t.si!==q.si)return;
  const e=a.ex[q.ei],[d,why]=restFor(e,e.sets[q.si]);t.total=Math.max(15,d+t.extra);t.why=why;t.end=t.start+t.total*1000;
  scheduleBeep((t.end-Date.now())/1000);saveTimer();
}
function saveActive(a,fast){put('active',a,fast?300:1500)}

/* ---------- rutina ---------- */
function volBars(v,label){

}
function vRutina(){

  let h=head(pi>=0?'Fase '+(pi+1)+' de '+PLAN.length+' · semana '+Math.min(wk,99)+' de '+PLAN[pi].w+(isDeload()?' · descarga':''):'Bloque '+((pr.block||0)+1)+' · semana '+wk+(isDeload()?' · descarga':''),'Rutina');

/* ---------- progreso ---------- */
function lineChart(pts,unit){
  if(pts.length<2)return '<div class="muted small">Hacen falta al menos dos registros para ver la curva.</div>';
  const W=340,H=150,L=38,R=12,T=12,B=24,ys=pts.map(p=>p.v);let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<1e-9){hi+=1;lo-=1}
  const padv=(hi-lo)*.12;lo-=padv;hi+=padv;
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const grid=[0,.5,1].map(f=>{const v=lo+(hi-lo)*f,yy=y(v);return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(Math.round(v*10)/10)}</text>`}).join('');
  const lp=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en ${esc(unit)}">${grid}
    <path d="${path} L${x(pts.length-1)} ${H-B} L${L} ${H-B} Z" fill="var(--accent)" opacity=".12"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:2.5}" fill="var(--accent)"/>`).join('')}

function saveProgram(fn){const p=clone(program());fn(p);put('program',p)}
function startDay(i){
  const pr=program(),d=pr.days[i],dl=isDeload();
  const a={start:Date.now(),date:today(),dayIdx:i,dayId:d.id,dayName:d.name,deload:dl,note:'',
    ex:d.ex.map(e=>({exId:e.exId,lo:e.lo,hi:e.hi,rest:e.rest||90,ss:e.ss?1:0,tec:e.tec||'',sets:Array.from({length:dl?Math.ceil(e.sets/2):e.sets},()=>({w:'',r:'',done:false}))}))};
  UI.timer=null;saveTimer();UI.rirAsk=null;UI.openEx=null;UI.warm=0;put('active',a,0);UI.sheet=null;UI.tab='session';render();
}
function finish(fat){
  const a=clone(active());closeRest(a);const prs=[];let sets=0,vol=0,reps=0,gm=0,gt=0;
  a.ex.forEach(e=>e.sets.forEach(x=>{if(x.done&&x.g!=null){gt++;gm+=x.g}}));
  const exs=a.ex.map(e=>({exId:e.exId,pain:e.pain||undefined,sets:e.sets.filter(s=>s.done).map(s=>{const r=Math.round(num(s.r)||0),an=s.as?Math.min(r,s.as.n||1):0;return [num(s.w)||0,r-an,s.rir==null?null:s.rir,an,an?s.as.l:0]}).filter(s=>s[1]>0||s[3]>0)})).filter(e=>e.sets.length);
  exs.forEach(e=>{
    const hist=histOf(e.exId),now=bestOf(e.exId,e.sets);
    if(hist.length){const old=bestOf(e.exId,[].concat(...hist.map(x=>x.sets)));if(now.v>old.v+1e-6)prs.push(ex(e.exId).n+': '+fmtN(now.set[0])+' kg × '+now.set[1])}
    e.sets.forEach(s=>{sets++;reps+=s[1];vol+=s[0]*s[1]});
  });
  const end=Date.now(),doneEx=a.ex.filter(e=>e.sets.some(x=>x.done));
  put('w_'+a.start,{date:a.date,start:a.start,end,dayId:a.dayId,dayName:a.dayName,deload:!!a.deload,ex:exs,note:a.note||'',fat:fat||null,over:a.over||0,goals:gt?[gm,gt]:null,gym:((profile()||{}).gym||{}).name||''},0);
  put('active',undefined,0);
  const pr=program();if(pr&&a.dayIdx!=null&&pr.days[a.dayIdx]&&pr.days[a.dayIdx].id===a.dayId)saveProgram(p=>p.next=(a.dayIdx+1)%p.days.length);
  UI.rirAsk=null;UI.tab='hoy';
  UI.sheet={t:'summary',min:Math.max(1,Math.round((end-a.start)/6e4)),sets,reps,vol,prs,gm,gt,over:a.over||0,nextG:a.deload?[]:doneEx.map(e=>{const tg=e.sets.map((_,k)=>suggest(e.exId,e.lo,e.hi,k,false)).filter(Boolean);if(!tg.length)return null;const same=tg.every(x=>x.w===tg[0].w);return [ex(e.exId).n,same?fmtN(tg[0].w)+' kg × '+(tg.every(x=>x.r===tg[0].r)?tg[0].r+' en cada serie':tg.map(x=>x.r).join(', ')):tg.map(x=>fmtN(x.w)+'×'+x.r).join(' · '),tg[0].top]}).filter(Boolean),week:weekCount(monday(today())),goal:(profile()||{}).days||5};
  render();
}
const ACT={
  tab(el){UI.tab=el.dataset.v;render()},
  close(){UI.sheet=null;renderSheet()},
  ovclose(el,ev){if(ev.target===el){UI.sheet=null;renderSheet()}},
  connect(){
    const v=($('#st-code')||$('#pf-code')).value.trim().replace(/\s+/g,''),k=v.lastIndexOf('.');
    if(k<20||k>=v.length-8){toast('Ese código no tiene el formato correcto');return}
    localStorage.setItem(CFG,JSON.stringify({u:v.slice(0,k),k:v.slice(k+1)}));S.since=0;S.mode='cargando';render();initSync();
  },
  skipsetup(){UI.skipSetup=true;render()},
  async copycode(){const c=cfg();try{await navigator.clipboard.writeText(c.u+'.'+c.k);toast('Código copiado: pegalo en el otro dispositivo')}catch(e){toast('No se pudo copiar')}},
  disconnect(){UI.sheet={t:'confirm',title:'¿Desconectar este dispositivo?',text:'Los datos quedan guardados en tu planilla. Este dispositivo deja de sincronizar hasta que pegues el código otra vez.',ok:'Desconectar',danger:true,fn(){localStorage.removeItem(CFG);S.col=null;S.mode='local';S.since=0;S.synced=false;saveLocal();render()}};renderSheet()},
  onboard(){
    const name=$('#ob-name').value.trim()||'',bw=num($('#ob-bw').value),h=num($('#ob-h').value),dv=$('#ob-days').value,days=dv==='fran'?5:+dv,focus=$('#ob-focus').value;
    put('profile',{v:4,name,height:h,days,bar:20,goal:'musculo',created:today(),supps:[{id:'creatina',name:'Creatina monohidrato',dose:'5 g',note:'Todos los días, a cualquier hora'}]},0);
    put('program',dv==='fran'?presetProgram('franopt',0):genProgram(days,focus,0),0);
    if(bw)setLogDay(today(),d=>d.bw=bw);
    UI.tab='hoy';render();
  },
  start(el){const i=+el.dataset.v;if(active()){UI.sheet={t:'confirm',title:'Ya hay un entrenamiento en curso',text:'Terminá o descartá el entrenamiento actual antes de empezar otro.',ok:'Ir al entrenamiento',fn(){UI.tab='session';render()}};renderSheet();return}startDay(i)},
  pickday(){UI.sheet={t:'pickday'};renderSheet()},
  resume(){UI.tab='session';render()},
  minimize(){UI.tab='hoy';render()},
  chk(el){
    const a=clone(active()),ei=+el.dataset.e,si=+el.dataset.s,e=a.ex[ei],s=e.sets[si];
    if(!s.done){
      const wi=$('#w-'+ei+'-'+si),ri=$('#r-'+ei+'-'+si);
      const w=num(wi.value)??num(wi.placeholder)??(ex(e.exId).bw?0:null),r=num(ri.value)??num(ri.placeholder);
      if(w==null||!r){toast('Cargá el peso y las repeticiones de la serie');(w==null?wi:ri).focus();return}
      const sg=a.deload?null:suggest(e.exId,e.lo,e.hi,si,false);
      if(sg){s.gw=sg.w;s.gr=sg.r;s.g=e1rm(w,Math.round(r))>=e1rm(sg.w,sg.r)-1e-6?1:0}
      s.w=fmtN(w);s.r=String(Math.round(r));s.done=true;
      for(let k=si+1;k<e.sets.length;k++)if(!e.sets[k].done&&e.sets[k].w==='')e.sets[k].w=s.w;
      const more=a.ex.some(x=>x.sets.some(y=>!y.done)),nx=a.ex[ei+1];
      UI.rirAsk={ei,si};UI.justChk=ei+'-'+si;if(UI.openEx===ei&&e.sets.every(x=>x.done))UI.openEx=null;
      closeRest(a);
      if(e.ss&&nx&&nx.sets[si]&&!nx.sets[si].done){toast('Superserie: seguí con '+ex(nx.exId).n+' sin descansar')}
      else if(more)startRest(e,s,ei,si);
    }else{s.done=false;delete s.rir;delete s.g;delete s.as;UI.rirAsk=null;UI.openEx=ei;if(UI.timer&&UI.timer.ei===ei&&UI.timer.si===si){UI.timer=null;cancelBeep();saveTimer()}}
    const fin=s.done&&e.sets.every(x=>x.done);
    saveActive(a,true);keepScroll(render);UI.justChk=null;
    if(fin){const nx=$('#ex-'+(ei+1));if(nx)try{nx.scrollIntoView({behavior:'smooth',block:'start'})}catch(_){}}
    try{if(s.done&&navigator.vibrate)navigator.vibrate(15)}catch(_){}
  },
  exopen(el){UI.openEx=+el.dataset.e;keepScroll(render)},
  rir(el){const q=UI.rirAsk;if(!q)return;const a=clone(active()),st=a.ex[q.ei]&&a.ex[q.ei].sets[q.si];if(st)st.rir=+el.dataset.v;retime(a);saveActive(a,true);keepScroll(render)},
  asl(el){const q=UI.rirAsk;if(!q)return;const a=clone(active()),e=a.ex[q.ei],st=e&&e.sets[q.si];if(!st)return;const v=+el.dataset.v;if(v){st.as={n:st.as?st.as.n:1,l:v};st.rir=0}else delete st.as;regoal(a,q.ei,q.si);retime(a);saveActive(a,true);keepScroll(render)},
  asn(el){const q=UI.rirAsk;if(!q)return;const a=clone(active()),st=a.ex[q.ei]&&a.ex[q.ei].sets[q.si];if(!st||!st.as)return;st.as.n=Math.max(1,Math.min(Math.round(num(st.r)||1),st.as.n+(+el.dataset.v)));regoal(a,q.ei,q.si);saveActive(a,true);keepScroll(render)},
  askdone(){UI.rirAsk=null;tickTimer()},
  warm(el){const v=+el.dataset.e;UI.warm=UI.warm===v?-1:v;keepScroll(render)},
  progm(el){UI.progM=el.dataset.v;render()},
  recall(){UI.recAll=true;render()},
  addset(el){const a=clone(active()),e=a.ex[+el.dataset.e],l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',r:'',done:false});saveActive(a,true);keepScroll(render)},
  delset(el){const a=clone(active()),e=a.ex[+el.dataset.e];if(e.sets.length>1)e.sets.pop();saveActive(a,true);keepScroll(render)},
  swap(el){const ei=+el.dataset.e,e=active().ex[ei];UI.sheet={t:'pick',title:'Cambiar ejercicio',m:ex(e.exId).m,mode:'swap',ei};renderSheet()},
  addex(){UI.sheet={t:'pick',title:'Agregar ejercicio',m:'',mode:'adds'};renderSheet()},
  pickm(el){UI.sheet.m=el.dataset.v;renderSheet()},
  pickex(el){applyPick(el.dataset.v)},
  cxadd(){
    const n=$('#cx-name').value.trim(),m=$('#cx-m').value;if(!n){toast('Escribí el nombre del ejercicio');return}
    const c=clone(S.docs.custom||{ex:[]}),id='c_'+uidx();c.ex.push({id,n,m,eq:'Otro',inc:2.5});put('custom',c);applyPick(id);
  },
  tech(el){UI.sheet={t:'tech',id:el.dataset.v};renderSheet()},
  finish(){
    const a=active(),done=a.ex.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0),left=a.ex.reduce((n,e)=>n+e.sets.filter(s=>!s.done).length,0);
    if(!done){UI.sheet={t:'confirm',title:'No marcaste ninguna serie',text:'Para guardar el entrenamiento marcá al menos una serie como hecha. ¿Querés descartarlo?',ok:'Descartar',danger:true,fn(){put('active',undefined,0);UI.timer=null;cancelBeep();saveTimer();UI.tab='hoy';render()}};renderSheet();return}
    if(left){UI.sheet={t:'confirm',title:'¿Terminar ahora?',text:'Te quedan '+left+' series sin marcar. Se guardan solo las series hechas.',ok:'Terminar y guardar',fn(){UI.sheet={t:'fatigue'};renderSheet()}};renderSheet();return}
    UI.sheet={t:'fatigue'};renderSheet();
  },
  discard(){UI.sheet={t:'confirm',title:'¿Descartar el entrenamiento?',text:'Se pierde lo que cargaste en esta sesión. No se puede deshacer.',ok:'Descartar',danger:true,fn(){put('active',undefined,0);UI.timer=null;cancelBeep();saveTimer();UI.tab='hoy';render()}};renderSheet()},
  fat(el){UI.sheet=null;finish(+el.dataset.v)},
  confirmok(){const f=UI.sheet.fn;UI.sheet=null;renderSheet();if(f)f()},
  tadj(el){const t=UI.timer;if(!t)return;const v=+el.dataset.v;if(t.total+v<15)return;t.extra+=v;t.total+=v;t.end=t.start+t.total*1000;scheduleBeep((t.end-Date.now())/1000);saveTimer();tickTimer()},
  tskip(){const a=clone(active());closeRest(a);saveActive(a,true);tickTimer()},
  phase(el){UI.sheet={t:'phase',i:+el.dataset.v};renderSheet()},
  phasego(el){
    if(active()){toast('Terminá el entrenamiento en curso antes de cambiar de fase');return}
    const old=program(),np=presetProgram(PLAN[+el.dataset.v].k,(old.block||0)+1);
    const n=workouts().filter(w=>w.date>=old.created&&!w.manual).length;
    np.past=(old.past||[]).concat([{name:old.name,from:old.created,to:today(),sessions:n}]).slice(-12);
    put('program',np,0);UI.sheet=null;UI.tab='rutina';toast(np.name+' en marcha');render();
  },
  pain(el){UI.sheet={t:'pain',ei:+el.dataset.e};renderSheet()},
  painset(el){const a=clone(active()),e=a.ex[UI.sheet.ei],v=+el.dataset.v;if(v)e.pain=v;else delete e.pain;saveActive(a,true);if(v>=2){render()}else{UI.sheet=null;keepScroll(render)}},
  painswap(){const ei=UI.sheet.ei,e=active().ex[ei];UI.sheet={t:'pick',title:'Cambiar ejercicio',m:ex(e.exId).m,mode:'swap',ei};renderSheet()},
  measure(){UI.sheet={t:'measure'};renderSheet()},
  measave(){const r={d:today()};let n=0;MEAS.forEach(([k])=>{const v=num($('#ms-'+k).value);if(v&&v>5&&v<300){r[k]=v;n++}});if(!n){toast('Cargá al menos una medida en centímetros');return}
    const b=clone(S.docs.body||{m:[]});const i=b.m.findIndex(x=>x.d===r.d);if(i>=0)b.m[i]=Object.assign(b.m[i],r);else b.m.push(r);put('body',b);UI.sheet=null;toast('Medidas guardadas');render()},
  meas(el){UI.measK=el.dataset.v;render()},
  phopen(el){UI.sheet={t:'photo',id:+el.dataset.v};renderSheet()},
  phdel(el){const id=+el.dataset.v;UI.sheet={t:'confirm',title:'¿Borrar esta foto?',text:'Se borra de este teléfono. No se puede deshacer.',ok:'Borrar',danger:true,async fn(){await phDelete(id);render()}};renderSheet()},
  travel(){if(active()){toast('Terminá el entrenamiento en curso primero');return}
    const L=[['bulgara',3,8,12,120],['press_incl_manc',3,8,12,120],['remo_manc',3,8,12,120],['pm_rumano',3,8,12,120],['press_hombros_manc',3,10,12,90],['lat_manc',3,12,15,60],['curl_alt',2,10,12,60],['fondos',2,8,12,90]];
    const a={start:Date.now(),date:today(),dayIdx:null,dayId:'viaje',dayName:'Modo viaje · cuerpo completo',deload:false,note:'',ex:L.map(([id,n,lo,hi,rest])=>({exId:id,lo,hi,rest,ss:0,tec:'',sets:Array.from({length:n},()=>({w:'',r:'',done:false}))}))};
    UI.timer=null;saveTimer();UI.rirAsk=null;UI.openEx=null;UI.warm=0;put('active',a,0);UI.sheet=null;UI.tab='session';render()},
  renew(){UI.sheet={t:'renew'};renderSheet()},
  renewok(){const p=clone(profile());p.gym={name:$('#gy-name').value.trim(),until:$('#gy-until').value||null};put('profile',p);UI.sheet=null;toast('Pase actualizado');render()},
  habpr(){setLogDay(today(),d=>{if(d.pr)delete d.pr;else d.pr=1});render()},
  hab(el){const k=el.dataset.k,v=+el.dataset.v;setLogDay(today(),d=>{let x=d[k];if(k==='sl'){x=x?x+v:(v>0?7:6.5);x=Math.max(0,Math.min(14,x))}else{x=Math.max(0,Math.min(300,(x||0)+v))}if(x)d[k]=x;else delete d[k]});render()},
  supp(el){const id=el.dataset.v;setLogDay(today(),d=>{d.s=d.s||{};if(d.s[id])delete d.s[id];else d.s[id]=1});render()},
  bw(){const v=num($('#bw-in').value);if(!v||v<30||v>250){toast('Ingresá un peso válido en kg');return}setLogDay(today(),d=>d.bw=v);toast('Peso guardado');render()},
  manual(){const t=Date.now();put('w_'+t,{date:today(),start:t,end:t,dayName:'Asistencia',manual:true,ex:[]},0);toast('Asistencia registrada');render()},
  deload(){saveProgram(p=>p.deload=isDeload()?null:monday(today()));toast(isDeload()?'Esta semana es de descarga':'Descarga quitada');render()},
  genopen(){const pr=program();UI.gen={kind:pr&&pr.preset==='fran'?'franopt':'auto',days:(profile()||{}).days>=3&&(profile()||{}).days<=6?(profile()||{}).days:5,focus:(pr&&pr.focus)||'equilibrado'};UI.sheet={t:'gen'};renderSheet()},
  gkind(el){UI.gen.kind=el.dataset.v;renderSheet()},
  gdays(el){UI.gen.days=+el.dataset.v;renderSheet()},
  gfocus(el){UI.gen.focus=el.dataset.v;renderSheet()},
  gengo(){
    const old=program(),np=genPreview();
    const n=workouts().filter(w=>w.date>=old.created&&!w.manual).length;
    np.past=(old.past||[]).concat([{name:old.name,from:old.created,to:today(),sessions:n}]).slice(-12);
    put('program',np,0);const p=clone(profile());p.days=np.days.length;put('profile',p);
    UI.sheet=null;UI.tab='rutina';toast('Rutina nueva lista');render();
  },
  editday(el){UI.sheet={t:'editday',i:+el.dataset.v};renderSheet()},
  dset(el){const i=UI.sheet.i,j=+el.dataset.j;saveProgram(p=>{const e=p.days[i].ex[j];e.sets=Math.max(1,Math.min(10,e.sets+(+el.dataset.v)))});render()},
  dss(el){const i=UI.sheet.i,j=+el.dataset.j;saveProgram(p=>{const e=p.days[i].ex[j];if(e.ss)delete e.ss;else e.ss=1});render()},
  dup(el){const i=UI.sheet.i,j=+el.dataset.j;if(!j)return;saveProgram(p=>{const a=p.days[i].ex;[a[j-1],a[j]]=[a[j],a[j-1]]});render()},
  ddel(el){const i=UI.sheet.i,j=+el.dataset.j;saveProgram(p=>p.days[i].ex.splice(j,1));render()},
  dadd(){UI.sheet={t:'pick',title:'Agregar a la rutina',m:'',mode:'addd',i:UI.sheet.i};renderSheet()},
  cal(el){const [y,m]=UI.calMonth.split('-').map(Number),d=new Date(y,m-1+(+el.dataset.v),1);UI.calMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render()},
  wday(el){const w=workouts().filter(x=>x.date===el.dataset.v).pop();if(w){UI.sheet={t:'workout',id:w.id};renderSheet()}},
  wopen(el){UI.sheet={t:'workout',id:el.dataset.v};renderSheet()},
  wdel(el){const id=el.dataset.v;UI.sheet={t:'confirm',title:'¿Borrar este entrenamiento?',text:'Se borra del historial y de la asistencia. No se puede deshacer.',ok:'Borrar',danger:true,fn(){put(id,undefined,0);render()}};renderSheet()},
  libm(el){UI.libM=el.dataset.v;render()},
  suppadd(){const n=$('#sp-name').value.trim();if(!n){toast('Escribí el nombre del suplemento');return}const p=clone(profile());p.supps=(p.supps||[]).concat([{id:'s_'+uidx(),name:n,dose:$('#sp-dose').value.trim(),note:''}]);put('profile',p);render()},
  suppdel(el){const p=clone(profile());p.supps=(p.supps||[]).filter(s=>s.id!==el.dataset.v);put('profile',p);render()},
  async export(){try{await navigator.clipboard.writeText(JSON.stringify(S.docs));toast('Respaldo copiado: pegalo en una nota para guardarlo')}catch(e){toast('No se pudo copiar en este navegador')}},
  wipe(){UI.sheet={t:'confirm',title:'¿Borrar todos tus datos?',text:'Se borran la rutina, el historial, la asistencia y los suplementos, en todos tus dispositivos. No se puede deshacer.',ok:'Borrar todo',danger:true,fn(){Object.keys(S.docs).forEach(id=>put(id,undefined,0));UI.tab='hoy';render()}};renderSheet()}
};
function applyPick(id){
  const s=UI.sheet;
  if(s.mode==='swap'){const a=clone(active());a.ex[s.ei].exId=id;a.ex[s.ei].sets.forEach(x=>{if(!x.done){x.w='';x.r=''}});saveActive(a,true)}
  else if(s.mode==='adds'){const a=clone(active());a.ex.push({exId:id,lo:8,hi:12,rest:90,sets:[0,1,2].map(()=>({w:'',r:'',done:false}))});saveActive(a,true)}
  else if(s.mode==='addd'){saveProgram(p=>p.days[s.i].ex.push({exId:id,sets:3,lo:8,hi:12,rest:90}));UI.sheet={t:'editday',i:s.i};render();return}
  UI.sheet=null;keepScroll(render);
}
function regoal(a,ei,si){const e=a.ex[ei],st=e.sets[si];if(st.gw==null)return;const own=Math.round(num(st.r)||0)-(st.as?st.as.n:0);st.g=e1rm(num(st.w)||0,own)>=e1rm(st.gw,st.gr)-1e-6?1:0}
function keepScroll(fn){const sc=$('#sscroll'),t=sc?sc.scrollTop:0;fn();const n=$('#sscroll');if(n)n.scrollTop=t}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const f=ACT[el.dataset.a];if(f)f(el,ev);
});
document.addEventListener('input',ev=>{
  const el=ev.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='set'){const a=clone(active());a.ex[+el.dataset.e].sets[+el.dataset.s][el.dataset.k]=el.value;saveActive(a)}
  else if(k==='note'){const a=clone(active());a.note=el.value;saveActive(a)}
  else if(k==='libq'){UI.libQ=el.value;const q=UI.libQ.trim().toLowerCase();$('#lib-list').innerHTML=libList(allEx().filter(e=>(!UI.libM||e.m===UI.libM)&&(!q||e.n.toLowerCase().includes(q))).sort((a,b)=>a.n.localeCompare(b.n)))}
  else if(k==='pickq'){UI.sheet.q=el.value;const s=UI.sheet,q=el.value.toLowerCase();$('#pk-list').innerHTML=pickList(allEx().filter(e=>(!s.m||e.m===s.m)&&(!q||e.n.toLowerCase().includes(q))).sort((a,b)=>a.n.localeCompare(b.n)))}
  else if(k==='dayname'){const i=UI.sheet.i,v=el.value;saveProgram(p=>p.days[i].name=v||'Día')}
});
document.addEventListener('change',ev=>{
  const el=ev.target,k=el.dataset&&el.dataset.in;if(!k)return;
  if(k==='photo'){const f=el.files&&el.files[0];el.value='';if(f)phAdd(f);return}
  if(k==='pf'){const p=clone(profile());let v=el.value;if(el.dataset.n){v=num(v);if(v==null&&el.dataset.k!=='height')return}else v=v.trim();p[el.dataset.k]=v;put('profile',p)}
  else if(k==='obplan'){$('#ob-focus-f').hidden=el.value==='fran'}
  else if(k==='progex'){UI.progEx=el.value;render()}
  else if(k==='drep'){const i=UI.sheet.i,j=+el.dataset.j,v=Math.round(num(el.value)||0);if(v<1||v>50){render();return}saveProgram(p=>{const e=p.days[i].ex[j];e[el.dataset.k]=v;if(e.lo>e.hi){if(el.dataset.k==='lo')e.hi=e.lo;else e.lo=e.hi}});render()}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&UI.sheet){UI.sheet=null;renderSheet()}});

let wake=null;
async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&UI.tab==='session'&&active())keepAwake(true)});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
/* ============ arranque ============ */
phLoad().then(()=>{if(UI.tab==='progreso')softRender()});
loadLocal();
try{const t=JSON.parse(localStorage.getItem('gym.timer')||'null');if(t&&S.docs.active&&Date.now()-t.end<9e5)UI.timer=t;else localStorage.removeItem('gym.timer')}catch(e){}
if(active())UI.tab='hoy';
render();
initSync();
</script>
